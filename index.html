<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cretes Programming Language</title>
  <meta name="description" content="Cretes is a modern compiled systems programming language.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Minimal & Professional Header -->
  <header class="site-header">
    <div class="header-container">
      
      <!-- Brand (Name Only, No Logo, No Version) -->
      <a href="/" class="brand-wrap" aria-label="Cretes Programming Language">
        <span class="brand-name">Cretes</span>
      </a>

      <!-- Navigation Links: Docs | Learn | Community | RFCs -->
      <nav aria-label="Main Navigation">
        <ul class="nav-menu">
          <li class="nav-item">
            <a href="https://github.com/Cretes-lang/spec" class="nav-link" target="_blank" rel="noopener">Docs</a>
          </li>
          <li class="nav-item">
            <a href="https://github.com/Cretes-lang/cretes/tree/main/examples" class="nav-link" target="_blank" rel="noopener">Learn</a>
          </li>
          <li class="nav-item">
            <a href="https://github.com/Cretes-lang" class="nav-link" target="_blank" rel="noopener">Community</a>
          </li>
          <li class="nav-item">
            <a href="https://github.com/Cretes-lang/rfcs" class="nav-link" target="_blank" rel="noopener">RFCs</a>
          </li>
        </ul>
      </nav>

      <!-- Right Actions: Light/Dark Mode | Get Started -->
      <div class="header-actions">
        <!-- Light / Dark Mode Toggle with User's Exact SVGs -->
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle light and dark theme">
          <!-- Injected via JavaScript -->
        </button>

        <!-- Primary Action -->
        <a href="https://github.com/Cretes-lang/cretes" target="_blank" rel="noopener noreferrer" class="btn-primary">
          Get Started
        </a>

        <!-- Mobile Menu Trigger -->
        <button id="mobile-open" class="action-btn mobile-btn" aria-label="Open mobile menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="18" x2="20" y2="18"></line>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- Mobile Drawer -->
  <div id="mobile-drawer" class="mobile-drawer">
    <div class="mobile-drawer-content">
      <div>
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span class="brand-name">Cretes</span>
          <button id="mobile-close" class="action-btn" aria-label="Close menu">✕</button>
        </div>
        <ul class="drawer-links">
          <li><a href="https://github.com/Cretes-lang/spec" class="drawer-link" target="_blank" rel="noopener">Docs</a></li>
          <li><a href="https://github.com/Cretes-lang/cretes/tree/main/examples" class="drawer-link" target="_blank" rel="noopener">Learn</a></li>
          <li><a href="https://github.com/Cretes-lang" class="drawer-link" target="_blank" rel="noopener">Community</a></li>
          <li><a href="https://github.com/Cretes-lang/rfcs" class="drawer-link" target="_blank" rel="noopener">RFCs</a></li>
        </ul>
      </div>
      <div>
        <a href="https://github.com/Cretes-lang/cretes" target="_blank" rel="noopener noreferrer" class="btn-primary" style="width: 100%; text-align: center;">Get Started</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
