<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cretes Programming Language</title>
  <meta name="description" content="Cretes is a modern compiled systems programming language.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Minimal & Professional Header -->
  <header class="site-header">
    <div class="header-container">
      
      <!-- Brand (Name Only, No Logo) -->
      <a href="/" class="brand-wrap" aria-label="Cretes Programming Language">
        <span class="brand-name">Cretes</span>
        <span class="brand-badge">v0.4.0</span>
      </a>

      <!-- Navigation Links -->
      <nav aria-label="Main Navigation">
        <ul class="nav-menu">
          <li class="nav-item">
            <a href="https://github.com/Cretes-lang/spec" class="nav-link" target="_blank" rel="noopener">
              Documentation
              <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </a>
            <div class="nav-dropdown">
              <a href="https://github.com/Cretes-lang/cretes" class="dropdown-link" target="_blank" rel="noopener">Quickstart Guide</a>
              <a href="https://github.com/Cretes-lang/spec" class="dropdown-link" target="_blank" rel="noopener">Phase 4 Language Tour</a>
              <a href="https://github.com/Cretes-lang/cretes" class="dropdown-link" target="_blank" rel="noopener">Standard Library (std::io, std::bytes)</a>
            </div>
          </li>
          <li class="nav-item">
            <a href="https://github.com/Cretes-lang/cretes/tree/main/examples" class="nav-link" target="_blank" rel="noopener">Playground</a>
          </li>
          <li class="nav-item">
            <a href="https://github.com/Cretes-lang/spec" class="nav-link" target="_blank" rel="noopener">Specification</a>
          </li>
          <li class="nav-item">
            <a href="https://github.com/Cretes-lang/rfcs" class="nav-link" target="_blank" rel="noopener">RFCs</a>
          </li>
          <li class="nav-item">
            <a href="https://github.com/Cretes-lang" class="nav-link" target="_blank" rel="noopener">Community</a>
          </li>
        </ul>
      </nav>

      <!-- Right Actions (Theme Toggle, GitHub, CTA) -->
      <div class="header-actions">
        <!-- Light / Dark Mode Toggle with User's Exact SVGs -->
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle light and dark theme">
          <!-- Injected via JavaScript -->
        </button>

        <!-- GitHub Repository Link -->
        <a href="https://github.com/Cretes-lang/cretes" target="_blank" rel="noopener noreferrer" class="github-link" aria-label="GitHub Repository">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </a>

        <!-- Primary Action -->
        <a href="https://github.com/Cretes-lang/cretes" target="_blank" rel="noopener noreferrer" class="btn-primary">
          Get Started
        </a>

        <!-- Mobile Menu Trigger -->
        <button id="mobile-open" class="action-btn mobile-btn" aria-label="Open mobile menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="18" x2="20" y2="18"></line>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- Mobile Drawer -->
  <div id="mobile-drawer" class="mobile-drawer">
    <div class="mobile-drawer-content">
      <div>
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span class="brand-name">Cretes</span>
          <button id="mobile-close" class="action-btn" aria-label="Close menu">✕</button>
        </div>
        <ul class="drawer-links">
          <li><a href="https://github.com/Cretes-lang/spec" class="drawer-link" target="_blank">Documentation</a></li>
          <li><a href="https://github.com/Cretes-lang/cretes/tree/main/examples" class="drawer-link" target="_blank">Playground</a></li>
          <li><a href="https://github.com/Cretes-lang/spec" class="drawer-link" target="_blank">Specification</a></li>
          <li><a href="https://github.com/Cretes-lang/rfcs" class="drawer-link" target="_blank">RFCs</a></li>
          <li><a href="https://github.com/Cretes-lang" class="drawer-link" target="_blank">Community</a></li>
        </ul>
      </div>
      <div>
        <a href="https://github.com/Cretes-lang/cretes" target="_blank" class="btn-primary" style="width: 100%; text-align: center;">Get Started</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
