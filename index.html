<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cretes Programming Language</title>
  <meta name="description" content="Cretes is a modern compiled systems programming language.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Minimal & Professional Header -->
  <header class="site-header">
    <div class="header-container">
      
      <!-- Brand (Name Only, No Logo, No Version) -->
      <a href="/" class="brand-wrap" aria-label="Cretes Programming Language">
        <span class="brand-name">Cretes</span>
      </a>

      <!-- Desktop Navigation Links: Docs | Learn | Community | RFCs -->
      <nav aria-label="Main Navigation">
        <ul class="nav-menu">
          <li class="nav-item">
            <a href="https://github.com/Cretes-lang/spec" class="nav-link" target="_blank" rel="noopener">Docs</a>
          </li>
          <li class="nav-item">
            <a href="https://github.com/Cretes-lang/cretes/tree/main/examples" class="nav-link" target="_blank" rel="noopener">Learn</a>
          </li>
          <li class="nav-item">
            <a href="https://github.com/Cretes-lang" class="nav-link" target="_blank" rel="noopener">Community</a>
          </li>
          <li class="nav-item">
            <a href="https://github.com/Cretes-lang/rfcs" class="nav-link" target="_blank" rel="noopener">RFCs</a>
          </li>
        </ul>
      </nav>

      <!-- Right Actions: Light/Dark Mode | Get Started | Mobile Hamburger -->
      <div class="header-actions">
        <!-- Light / Dark Mode Toggle with User's Exact SVGs -->
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle light and dark theme">
          <!-- Injected via JavaScript -->
        </button>

        <!-- Primary Action -->
        <a href="https://github.com/Cretes-lang/cretes" target="_blank" rel="noopener noreferrer" class="btn-primary desktop-cta">
          Get Started
        </a>

        <!-- Minimal Animated Corporate Hamburger Button -->
        <button id="mobile-toggle" class="mobile-toggle-btn" aria-label="Toggle navigation menu" aria-expanded="false">
          <span class="line line-top"></span>
          <span class="line line-bottom"></span>
        </button>
      </div>

    </div>
  </header>

  <!-- Full-Width Minimalist Corporate Mobile Menu -->
  <div id="mobile-menu" class="mobile-menu-overlay" aria-hidden="true">
    <div class="mobile-menu-inner">
      <nav aria-label="Mobile Navigation">
        <ul class="mobile-menu-nav">
          <li class="mobile-menu-item">
            <a href="https://github.com/Cretes-lang/spec" class="mobile-menu-link" target="_blank" rel="noopener">
              <span>Docs</span>
              <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </a>
          </li>
          <li class="mobile-menu-item">
            <a href="https://github.com/Cretes-lang/cretes/tree/main/examples" class="mobile-menu-link" target="_blank" rel="noopener">
              <span>Learn</span>
              <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </a>
          </li>
          <li class="mobile-menu-item">
            <a href="https://github.com/Cretes-lang" class="mobile-menu-link" target="_blank" rel="noopener">
              <span>Community</span>
              <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </a>
          </li>
          <li class="mobile-menu-item">
            <a href="https://github.com/Cretes-lang/rfcs" class="mobile-menu-link" target="_blank" rel="noopener">
              <span>RFCs</span>
              <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </a>
          </li>
        </ul>
      </nav>

      <div class="mobile-menu-footer">
        <a href="https://github.com/Cretes-lang/cretes" target="_blank" rel="noopener noreferrer" class="btn-primary mobile-menu-cta">
          Get Started
        </a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
