name: Bug Report
description: Report a bug, crash, or unexpected behavior in Cretes.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        If this is a security or soundness issue, please report it via [SECURITY.md](https://cretes.org/SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: Provide the smallest Cretes code snippet that demonstrates the issue.
      placeholder: |
        fn main() {
            // Your minimal code here
        }
      render: cretes
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Cretes Version
      description: Run `cretes --version` and paste the output.
      placeholder: "cretes 1.0.0 (Aura 2026-10-09)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (x86_64)
        - Linux (aarch64)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (x86_64)
        - Other
    validations:
      required: true
