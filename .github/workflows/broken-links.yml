name: Broken Link Monitoring

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 1' # Run weekly on Mondays at 04:00 UTC

permissions:
  contents: read

jobs:
  link-check:
    name: Link Integrity Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Internal Links & Document Targets
        run: npm run check-links
