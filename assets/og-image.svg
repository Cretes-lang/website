<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b7bff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0b0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0b0e"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Content -->
  <g transform="translate(100, 220)">
    <!-- Brand Name -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="84" font-weight="800" letter-spacing="-0.04em" fill="url(#textGrad)">Cretes</text>
    
    <!-- Subtitle -->
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="32" font-weight="500" fill="#94a3b8">A modern compiled systems programming language.</text>
    
    <!-- Tagline -->
    <text x="0" y="220" font-family="cursive, 'Segoe Script', 'Georgia'" font-size="36" font-style="italic" fill="#f8fafc" opacity="0.9">Stay Curious. Keep Coding.</text>
  </g>

  <!-- Bottom URL -->
  <text x="100" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="600" letter-spacing="0.05em" fill="#64748b">CRETES.ORG</text>
</svg>
